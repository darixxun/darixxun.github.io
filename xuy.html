<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Кнопка на весь экран</title>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #fff; /* Цвет фона страницы */
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .iframe-container {
            position: relative;
            width: 110px;  /* Исходный размер блока эмбеда */
            height: 150px; /* Обрезаем лишний текст снизу кнопки */
            overflow: hidden;
            /* Увеличиваем кнопку в 4.5 раза. Если мало или много — измени цифру ниже */
            transform: scale(4.5); 
            transform-origin: center center;
        }

        .iframe-container iframe {
            width: 100%;
            height: 100%;
            border: none;
        }
    </style>
</head>
<body>

    <div class="iframe-container">
        <iframe src="https://www.myinstants.com/instant/sela-dala-27691/embed/" scrolling="no"></iframe>
    </div>

</body>
</html>
