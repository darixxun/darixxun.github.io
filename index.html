<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Рандомная кнопка</title>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #fff;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .iframe-container {
            position: relative;
            width: 110px;  
            height: 150px; 
            overflow: hidden;
            /* Кнопка увеличена в 4.5 раза, как в прошлый раз */
            transform: scale(4.5); 
            transform-origin: center center;
        }

        .iframe-container iframe {
            width: 100%;
            height: 100%;
            border: none;
        }
    </style>
</head>
<body>

    <div class="iframe-container">
        <!-- id="random-button" нужен, чтобы JavaScript нашел этот iframe -->
        <iframe id="random-button" src="" scrolling="no"></iframe>
    </div>

    <script>
        // Список твоих ссылок
        const buttons = [
            "https://www.myinstants.com/instant/vykliuchi-ego-nakhu-12313/embed/",
            "https://www.myinstants.com/instant/zelenskii-42468/embed/",
            "https://www.myinstants.com/instant/ston-250-10009/embed/",
            "https://www.myinstants.com/instant/sela-dala-27691/embed/",
            "https://www.myinstants.com/instant/vakh-mama-dzhan-41020/embed/",
            "https://www.myinstants.com/instant/yara-yara-phonk-16631/embed/"
        ];

        // Выбираем случайную ссылку из массива
        const randomIndex = Math.floor(Math.random() * buttons.length);
        const randomUrl = buttons[randomIndex];

        // Вставляем её в iframe
        document.getElementById('random-button').src = randomUrl;
    </script>

</body>
</html>
